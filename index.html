        <h1>bAssistant — In-Browser AI Workspace &amp; Diagram Studio</h1>
        <p>bAssistant is a zero-server, 100% client-side web application pairing an interactive Canvas2D diagram studio with a conversational AI workspace.</p>
        <h2>Key Architecture &amp; Capabilities</h2>
        <ul>
          <li><strong>20/80 Cockpit Layout:</strong> 20% control sidebar for document ingestion (&lt; 2MB PDF/DOCX) and reference links, 80% primary workspace split into 60% Canvas2D and 40% dialogue reader.</li>
          <li><strong>Interactive Canvas2D:</strong> Auto-centering scene graph with pan, zoom, perimeter docking, and high-visibility labels in both light and dark themes.</li>
          <li><strong>17 Zero-Install WebMCP Tools:</strong> Exposes browser-native model context protocol tools for diagram drawing, document BM25 search, math, ArXiv research, and publication PDF export.</li>
          <li><strong>Client-Side Privacy:</strong> Zero server footprint. All indexing, parsing, and session persistence remain inside browser IndexedDB.</li>
        </ul>
        <p>JavaScript is required to run the interactive canvas and conversational tools in this application.</p>
